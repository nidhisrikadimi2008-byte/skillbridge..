{id:4,co:"InfraLabs",title:"DevOps Project",type:"PROJECT",skills:["Docker","Java","DSA"],d:"Containerise legacy services with CI/CD.",loc:"Remote · 6 weeks"},
{id:5,co:"AlgoWorks",title:"Software Engineer Intern",type:"INTERNSHIP",skills:["DSA","Java","Python"],d:"Optimise core search algorithms.",loc:"Hyderabad · 6 mo · ₹30k/mo"}];

 profile:()=>({...P,analysis:Object.entries(P.skills).map(([k,v])=>({skill:k,level:v,status:st(v),req:(REQ[P.target]||{})[k]||0}))}),

function landing(){return`<div class="hero"><span class="tag">SIH 2026 · PS 26044</span><h1>Your Skills. Your Future. <span>One Bridge.</span></h1><div class="kin"><span id="rot" class="rot">Learn</span> with purpose.</div><p style="max-width:620px;margin:12px auto 22px">AI skill mapping, smart internship matching and placement analytics — connecting students, companies and colleges on one platform.</p><button class="btn" onclick="document.getElementById('auth').scrollIntoView({behavior:'smooth'})">Start Your Journey →</button> <button class="btn o" onclick="document.getElementById('feat').scrollIntoView({behavior:'smooth'})">Explore Skills</button></div>

${S.mode=="up"?'<input id="nm" placeholder="Full name">':""}<input id="em" type="email" placeholder="Email" autocomplete="email" onkeydown="if(event.key=='Enter')login()"><div style="position:relative"><input id="pw" type="password" placeholder="Password" autocomplete="${S.mode=="up"?"new-password":"current-password"}" oninput="pwHint()" onkeydown="pwKey(event)" style="padding-right:48px"><button type="button" class="eye" aria-label="Show password" aria-pressed="false" onclick="eye('pw',this)">${EYE}</button></div>${S.mode=="up"?`<div style="position:relative"><input id="pw2" type="password" placeholder="Confirm password" autocomplete="new-password" oninput="pwHint()" onkeydown="pwKey(event)" style="padding-right:48px"><button type="button" class="eye" aria-label="Show confirm password" aria-pressed="false" onclick="eye('pw2',this)">${EYE}</button></div>`:""}<div id="ph" aria-live="polite" style="font-size:.8rem;min-height:1.2em;margin-bottom:8px"></div><button class="btn" style="width:100%" onclick="login()">Continue as ${S.role}</button><p style="text-align:center;cursor:pointer;color:#7dd3fc" onclick="S.mode=S.mode=='in'?'up':'in';draw()">${S.mode=="in"?"New here? Sign up":"Have an account? Sign in"}</p><p id="err" style="color:var(--r);min-height:1.2em;margin:6px 0 0;font-size:.85rem"></p></div>`}

const BQ=[['What are my skill gaps?','gap|weak',()=>{const r=api.recs();return !P.target?'Set a target role in your Profile first.':r.length?'Biggest gaps for '+P.target+': '+r.slice(0,3).map(x=>x.skill+' (-'+x.gap+')').join(', ')+'.':'No gaps against the '+P.target+' requirements.'}],['What should I learn first?','learn|first|next',()=>{const r=api.recs()[0];return r?'Start with '+r.skill+'. '+r.res:P.target?'You meet every listed requirement.':'Set a target role in your Profile first.'}],['Am I ready for my target role?','ready|role|target',()=>P.target?'Estimated skill fit for '+P.target+': '+fit(P.skills,P.target)+'%. This is an estimate from your self-reported levels, not a placement guarantee.':'Set a target role in your Profile first.'],['Show my roadmap','roadmap|plan',()=>{const r=api.recs().slice(0,4);return r.length?r.map((x,i)=>'Month '+(i+1)+': '+x.skill).join(' → ')+' → apply to top matches → mock interviews.':'Add skills and a target role to generate a roadmap.'}],['Which opportunity fits me best?','intern|opportun|match',()=>{const o=api.opps()[0];return o?o.title+' at '+o.co+' ('+o.m+'% match).':'No opportunities have been posted yet.'}],['How is my interview practice?','interview|mock|practice',()=>{ensure();return P.mock.length?'You completed '+P.mock.length+' session(s), average '+Math.round(P.mock.reduce((a,b)=>a+b.s,0)/P.mock.length)+'%.':'No mock interviews yet. Try the Interview Arena tab.'}]];
function botInit(){document.body.insertAdjacentHTML('beforeend',`<button id='bb' class='btn' aria-label='Open BridgeBot career assistant' onclick='botT()'>🤖</button><div id='bp' class='card' role='dialog' aria-label='BridgeBot'><div class='row'><b>BridgeBot</b><small>offline · rule-based</small></div><div id='bl'></div><div id='bc'></div><div class='row'><input id='bi' placeholder='Ask about your profile…' aria-label='Ask BridgeBot' style='margin:0'><button class='btn s' onclick='botSend()'>Send</button></div></div><div id='np' class='card' role='region' aria-label='Notifications'></div>`);$('bc').innerHTML=BQ.map((q,i)=>`<button class='btn o s' style='margin:3px' onclick='botAsk(${i})'>${q[0]}</button>`).join('');$('bi').onkeydown=e=>{if(e.key=='Enter')botSend()};botMsg('Hi! I answer from your saved profile, gaps, target role and roadmap. Pick a question below.')}
function botMsg(t,me){const d=document.createElement('div');d.className='msg'+(me?' me':'');d.textContent=t;$('bl').appendChild(d);$('bp').scrollTop=1e5}
function botAsk(i){botMsg(BQ[i][0],1);botMsg(BQ[i][2]())}
async function botSend(){const v=$('bi').value.trim().slice(0,300);if(!v)return;$('bi').value='';botMsg(v,1);const l=v.toLowerCase(),i=BQ.findIndex(q=>q[1].split('|').some(k=>l.includes(k)));if(i>=0)return botMsg(BQ[i][2]());if(BOT_ENDPOINT){try{const r=await fetch(BOT_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:v,target:P.target,skills:P.skills})}),j=await r.json();return botMsg(String(j.reply||'No reply.'))}catch(e){return botMsg('The AI service could not be reached.')}}botMsg('Offline, I only answer the preset questions. Point BOT_ENDPOINT at your backend to enable open-ended AI answers.')}
function botT(){$('bp').classList.toggle('on')}
const EYE="<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z'/><circle cx='12' cy='12' r='3'/></svg>",EYEOFF="<svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M17.9 17.9A10.9 10.9 0 0 1 12 19C5.6 19 2 12 2 12a18 18 0 0 1 4.1-5.1M9.9 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2'/><path d='M9.9 9.9a3 3 0 0 0 4.2 4.2M1 1l22 22'/></svg>";
function eye(id,b){const i=$(id),s=i.type=='password';i.type=s?'text':'password';b.innerHTML=s?EYEOFF:EYE;b.setAttribute('aria-pressed',s);b.setAttribute('aria-label',(s?'Hide ':'Show ')+(id=='pw2'?'confirm password':'password'));snd(600,.06)}
function pwKey(e){if(e.key=='Enter'){login();return}const h=$('ph');if(h)h.dataset.caps=(e.getModifierState&&e.getModifierState('CapsLock'))?'1':'';pwHint()}
function pwHint(){const h=$('ph');if(!h)return;const p=$('pw').value,q=$('pw2'),o=[];if(S.mode=='up'&&p){const n=(p.length>=8)+/[A-Z]/.test(p)+/\d/.test(p)+/[^A-Za-z0-9]/.test(p)+(p.length>=12),L=['Very weak','Weak','Fair','Good','Strong','Excellent'][n],c=n<2?'#EF4444':n<4?'#F59E0B':'#10B981';o.push(`<span style='color:${c}'>Strength: ${L}</span>`)}if(q&&q.value)o.push(q.value===p?`<span style='color:#10B981'>Passwords match</span>`:`<span style='color:#EF4444'>Passwords do not match</span>`);if(h.dataset.caps)o.push(`<span style='color:#F59E0B'>Caps Lock is on</span>`);h.innerHTML=o.join(' · ')}
function uiSync(){if(!$('bb'))botInit();const stu=EM&&S.role=='student'&&S.v=='student';$('bb').style.display=stu?'block':'none';if(!stu)$('bp').classList.remove('on');if(!EM)$('np').classList.remove('on');if(S.v=='student'){syncNotes();if(S.tab=='gal')setTimeout(galStart,0);if(S.tab=='mock'&&M&&!M.end)mTimer()}}
draw();
</script></body></html>
